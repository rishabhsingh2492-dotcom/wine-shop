services:
  - type: web
    name: wineiq-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py import_wine_data
    startCommand: python manage.py migrate && python manage.py import_wine_data && gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: wineiq-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
databases:
  - name: wineiq-db
    plan: free


